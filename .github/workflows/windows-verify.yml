name: windows-verify
on: workflow_dispatch

jobs:
  x64:
    runs-on: windows-latest        # 云端 Windows x64 机器
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 安装依赖(如果有package.json)
        shell: pwsh
        run: |
          if (Test-Path package.json) { npm install } else { Write-Host "无 package.json，跳过" }
      - name: 运行测试
        shell: pwsh
        run: |
          $files = Get-ChildItem -Filter *.test.js -Name
          node --test --test-concurrency=1 $files
      - run: node --check install-all.js
      - run: node --check platform-support.js
      - run: node --check software-manifest.js
      - run: node --check checksum.js
      - run: node install-all.js --dry-run
      - name: 验证Add-AppxPackage能否直接安装MSIX
        shell: pwsh
        continue-on-error: true
        run: |
          $msixFiles = Get-ChildItem "$env:USERPROFILE\Downloads\AI工具安装包\*.msix" -ErrorAction SilentlyContinue
          if (-not $msixFiles) {
            Write-Host "没找到任何 .msix 文件，跳过"
          } else {
            foreach ($file in $msixFiles) {
              Write-Host "==== 尝试安装: $($file.Name) ===="
              try {
                Add-AppxPackage -Path $file.FullName -ErrorAction Stop
                Write-Host "[结果] 安装成功: $($file.Name)"
              } catch {
                Write-Host "[结果] 安装失败: $($file.Name)"
                $_.Exception | Format-List * -Force
              }
            }
          }
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation, Status
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex' }
      - run: node install-all.js
      - name: 查询已安装的包
        shell: pwsh
        run: |
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex|CC Switch' }

  arm64:
    runs-on: windows-11-arm        # 云端 Windows ARM64 机器
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 安装依赖(如果有package.json)
        shell: pwsh
        run: |
          if (Test-Path package.json) { npm install } else { Write-Host "无 package.json，跳过" }
      - name: 运行测试
        shell: pwsh
        run: |
          $files = Get-ChildItem -Filter *.test.js -Name
          node --test --test-concurrency=1 $files
      - run: node --check install-all.js
      - run: node --check platform-support.js
      - run: node --check software-manifest.js
      - run: node --check checksum.js
      - run: node install-all.js --dry-run
      - name: 验证Add-AppxPackage能否直接安装MSIX
        shell: pwsh
        continue-on-error: true
        run: |
          $msixFiles = Get-ChildItem "$env:USERPROFILE\Downloads\AI工具安装包\*.msix" -ErrorAction SilentlyContinue
          if (-not $msixFiles) {
            Write-Host "没找到任何 .msix 文件，跳过"
          } else {
            foreach ($file in $msixFiles) {
              Write-Host "==== 尝试安装: $($file.Name) ===="
              try {
                Add-AppxPackage -Path $file.FullName -ErrorAction Stop
                Write-Host "[结果] 安装成功: $($file.Name)"
              } catch {
                Write-Host "[结果] 安装失败: $($file.Name)"
                $_.Exception | Format-List * -Force
              }
            }
          }
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation, Status
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex' }
      - run: node install-all.js
      - name: 查询已安装的包
        shell: pwsh
        run: |
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex|CC Switch' }
