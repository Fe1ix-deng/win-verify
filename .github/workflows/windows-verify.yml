name: windows-verify
on: workflow_dispatch

jobs:
  x64:
    runs-on: windows-latest        # 云端 Windows x64 机器
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 安装依赖
        run: npm ci
      - name: 运行测试
        shell: pwsh
        run: |
          $files = Get-ChildItem -Filter *.test.js -Name
          node --test --test-concurrency=1 $files
      - run: node --check install-all.js
      - run: node --check platform-support.js
      - run: node --check software-manifest.js
      - run: node --check checksum.js
      - run: node install-all.js --dry-run
      - name: 验证Add-AppxPackage能否直接安装MSIX
        shell: pwsh
        continue-on-error: true
        run: |
          $msixFiles = Get-ChildItem "$env:USERPROFILE\Downloads\AI工具安装包\*.msix" -ErrorAction SilentlyContinue
          if (-not $msixFiles) {
            Write-Host "没找到任何 .msix 文件，跳过"
          } else {
            foreach ($file in $msixFiles) {
              Write-Host "==== 尝试安装: $($file.Name) ===="
              try {
                Add-AppxPackage -Path $file.FullName -ErrorAction Stop
                Write-Host "[结果] 安装成功: $($file.Name)"
              } catch {
                Write-Host "[结果] 安装失败: $($file.Name)"
                $_.Exception | Format-List * -Force
              }
            }
          }
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation, Status | Format-List
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex' } | Format-List
      - name: 通过清单获取真实AppUserModelId
        shell: pwsh
        run: |
          foreach ($pkgName in @('OpenAI.Codex', 'Claude')) {
            $pkg = Get-AppxPackage -Name $pkgName -ErrorAction SilentlyContinue
            if (-not $pkg) {
              Write-Host "$pkgName 未找到已安装的包，跳过"
              continue
            }
            $manifest = Get-AppxPackageManifest -Package $pkg
            Write-Host "==== $pkgName ===="
            $manifest.Package.Applications.Application | Select-Object Id, Executable, EntryPoint | Format-List
            $manifest.Package.Applications.Application | ForEach-Object {
              Write-Host "AppUserModelId: $($pkg.PackageFamilyName)!$($_.Id)"
            }
          }
      - run: node install-all.js
      - name: 查询已安装的包
        shell: pwsh
        run: |
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation | Format-List
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex|CC Switch' } | Format-List
      - name: 检查pkg版本
        run: npx pkg --version
      - name: 构建x64 exe
        run: npm run build:win:x64
      - name: 验证PE架构(x64)
        run: npm run verify:pe:x64
      - name: 运行exe自检(x64)
        shell: pwsh
        run: |
          & ".\dist\ai-installer-win-x64.exe" --print-target
      - name: 计算大小和SHA256(x64)
        shell: pwsh
        run: |
          Get-Item dist\ai-installer-win-x64.exe | Select-Object Name, Length
          Get-FileHash dist\ai-installer-win-x64.exe -Algorithm SHA256

