name: windows-verify
on: workflow_dispatch

jobs:
  x64:
    runs-on: windows-latest        # 云端 Windows x64 机器
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 安装依赖(如果有package.json)
        shell: pwsh
        run: |
          if (Test-Path package.json) { npm install } else { Write-Host "无 package.json，跳过" }
      - run: node --test --test-concurrency=1 *.test.js
      - run: node --check install-all.js
      - run: node --check platform-support.js
      - run: node --check software-manifest.js
      - run: node --check checksum.js
      - run: node install-all.js --dry-run
      - run: node install-all.js
      - name: 查询已安装的包
        shell: pwsh
        run: |
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex|CC Switch' }

  arm64:
    runs-on: windows-11-arm        # 云端 Windows ARM64 机器
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 安装依赖(如果有package.json)
        shell: pwsh
        run: |
          if (Test-Path package.json) { npm install } else { Write-Host "无 package.json，跳过" }
      - run: node --test --test-concurrency=1 *.test.js
      - run: node --check install-all.js
      - run: node --check platform-support.js
      - run: node --check software-manifest.js
      - run: node --check checksum.js
      - run: node install-all.js --dry-run
      - run: node install-all.js
      - name: 查询已安装的包
        shell: pwsh
        run: |
          Get-AppxPackage | Where-Object { $_.Name -match 'Claude|Anthropic|Codex|OpenAI' } |
            Select-Object Name, PackageFullName, InstallLocation
          Get-StartApps | Where-Object { $_.Name -match 'Claude|Codex|CC Switch' }
