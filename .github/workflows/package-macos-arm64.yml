name: Package macOS Apple Silicon artifact

on:
  push:
    branches:
      - feature/macos-arm64-experimental
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned macOS arm64 installer
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Record and assert Apple Silicon runner
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo 'uname -a'
            uname -a
            echo 'uname -m'
            uname -m
            echo 'sw_vers'
            sw_vers
            echo 'node --version'
            node --version
            echo 'npm --version'
            npm --version
            echo 'df -h'
            df -h
          } | tee dist/runner-evidence-macos-arm64.txt
          test "$(uname -m)" = arm64
      - run: npm test
      - run: node --check install-all.js
      - run: node --check macos-installer.js
      - run: node --check platform-support.js
      - run: node --check software-manifest.js
      - name: Verify pkg version
        run: |
          version="$(npx pkg --version)"
          test "$version" = "5.8.1"
      - name: Build unsigned macOS arm64 installer
        run: npm run build:macos:arm64
      - name: Verify packaged arm64 target
        run: |
          set -euo pipefail
          test -f dist/ai-installer-macos-arm64.dmg
          mount_point="$RUNNER_TEMP/ai-installer-mount"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" dist/ai-installer-macos-arm64.dmg
          trap 'hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true' EXIT
          test -x "$mount_point/AI Installer.command"
          test -x "$mount_point/.ai-installer-macos-arm64"
          target="$("$mount_point/AI Installer.command" --print-target)"
          printf '%s\n' "$target" | tee dist/print-target.txt
          node -e 'const target = JSON.parse(process.argv[1]); if (target.platform !== "darwin" || target.arch !== "arm64" || target.isWindows !== false) process.exit(1);' "$target"
      - name: Record unsigned build evidence
        run: |
          set -euo pipefail
          shasum -a 256 dist/ai-installer-macos-arm64.dmg > dist/SHA256SUMS.txt
          file_output="$(file dist/ai-installer-macos-arm64.dmg)"
          printf '%s\n' "$file_output" | tee dist/file-evidence.txt
          printf '%s\n' "$file_output" | grep -Eiq 'DMG|disk image'
          size_bytes="$(stat -f%z dist/ai-installer-macos-arm64.dmg)"
          {
            echo "platform=darwin"
            echo "architecture=arm64"
            echo "size_bytes=$size_bytes"
            echo "print_target=$(cat dist/print-target.txt)"
            echo "signed=false"
            echo "notarized=false"
            echo "launch=not-tested: workflow does not claim GUI launch success"
            echo "release=false: temporary GitHub Actions artifact only; no Release or tag"
          } > dist/build-evidence-macos-arm64.txt
      - name: Check clean user Applications directory
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Applications"
          : > dist/preexisting-apps.txt
          for app in 'CC Switch.app' 'Claude.app' 'ChatGPT.app'; do
            app_path="$HOME/Applications/$app"
            if [ -e "$app_path" ]; then
              echo "blocked: pre-existing $app_path" | tee -a dist/preexisting-apps.txt
              exit 1
            fi
            echo "absent: $app_path" | tee -a dist/preexisting-apps.txt
          done
      - name: Run packaged installer in CI mode
        id: macos_install
        continue-on-error: true
        run: |
          set +e
          mount_point="$RUNNER_TEMP/ai-installer-mount-ci"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" dist/ai-installer-macos-arm64.dmg >/dev/null
          trap 'hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true' EXIT
          "$mount_point/AI Installer.command" --ci 2>&1 | tee dist/macos-install-validation.log
          installer_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$installer_status" | tee dist/installer-exit-code.txt
          printf 'installer_exit_code=%s\n' "$installer_status" >> dist/macos-install-validation.log
          exit "$installer_status"
      - name: Verify installed application bundles
        id: bundle_validation
        if: steps.macos_install.outcome == 'success'
        run: |
          set -euo pipefail
          verify_app() {
            local label="$1"
            local slug="$2"
            local app_path="$3"
            local expected_bundle_id="$4"
            local expected_executable="$5"
            local plist="$app_path/Contents/Info.plist"
            local executable="$app_path/Contents/MacOS/$expected_executable"
            local evidence="dist/${slug}-validation.txt"

            {
              echo "application=$label"
              echo "app_path=$app_path"
              test -d "$app_path"
              echo 'directory=present'
              test -f "$plist"
              bundle_id="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$plist")"
              bundle_executable="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$plist")"
              echo "Bundle ID: $bundle_id"
              echo "CFBundleExecutable: $bundle_executable"
              test "$bundle_id" = "$expected_bundle_id"
              test "$bundle_executable" = "$expected_executable"
              test -x "$executable"
              echo 'main_executable=present'
              /usr/bin/file "$executable"
              /usr/bin/file "$executable" | grep -Eiq 'arm64'
              lipo -info "$executable"
              lipo -info "$executable" | grep -Eiq 'arm64'
              /usr/bin/codesign --verify --deep --strict --verbose=4 "$app_path"
              /usr/sbin/spctl --assess --type execute --verbose=4 "$app_path"
              echo 'codesign=passed'
              echo 'spctl=passed'
            } 2>&1 | tee "$evidence"
          }

          verify_app 'CC Switch' 'cc-switch' "$HOME/Applications/CC Switch.app" 'com.ccswitch.desktop' 'cc-switch'
          verify_app 'Claude Desktop' 'claude' "$HOME/Applications/Claude.app" 'com.anthropic.claudefordesktop' 'Claude'
          verify_app 'Codex' 'codex' "$HOME/Applications/ChatGPT.app" 'com.openai.codex' 'ChatGPT'
      - name: Extract and validate checksum evidence
        if: always()
        run: |
          set -euo pipefail
          : > dist/macos-checksum-validation.txt
          if [ -f dist/macos-install-validation.log ]; then
            awk '/^checksum: / { sub(/^checksum: /, ""); print }' \
              dist/macos-install-validation.log > dist/macos-checksum-validation.txt
          fi
          if [ "${{ steps.macos_install.outcome }}" = success ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('dist/macos-checksum-validation.txt', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const expected = new Set(['CC Switch', 'Claude Desktop', 'Codex']);
          if (lines.length !== expected.size) throw new Error(`expected ${expected.size} checksum records, got ${lines.length}`);
          for (const record of lines) {
            if (!expected.delete(record.application)) throw new Error(`unexpected or duplicate application: ${record.application}`);
            if (record.status !== 'passed') throw new Error(`checksum failed for ${record.application}`);
            if (!/^[0-9a-f]{64}$/i.test(record.expected) || !/^[0-9a-f]{64}$/i.test(record.actual)) {
              throw new Error(`checksum evidence is incomplete for ${record.application}`);
            }
            if (record.expected.toLowerCase() !== record.actual.toLowerCase()) {
              throw new Error(`checksum mismatch for ${record.application}`);
            }
          }
          if (expected.size !== 0) throw new Error(`missing checksum records: ${[...expected].join(', ')}`);
          NODE
          fi
      - name: Write final verification summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "runner.uname_m=$(uname -m)"
            if [ -f dist/installer-exit-code.txt ]; then
              echo "installer_exit_code=$(cat dist/installer-exit-code.txt)"
            else
              echo 'installer_exit_code=not-run'
            fi
            echo "bundle_validation_step=${{ steps.bundle_validation.outcome || 'not-run' }}"
            echo 'launch=not-tested'
            echo 'release=false'
            echo 'artifact=ai-installer-macos-arm64-experimental'
          } | tee dist/final-verification-summary.txt
      - name: Assert complete installation validation passed
        if: always()
        run: |
          set -euo pipefail
          test -f dist/installer-exit-code.txt
          test "$(cat dist/installer-exit-code.txt)" = 0
          test -s dist/cc-switch-validation.txt
          test -s dist/claude-validation.txt
          test -s dist/codex-validation.txt
          grep -q '^bundle_validation_step=success$' dist/final-verification-summary.txt
          grep -q '^launch=not-tested$' dist/final-verification-summary.txt
      - name: Upload temporary macOS arm64 verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-installer-macos-arm64-experimental
          path: |
            dist/ai-installer-macos-arm64.dmg
            dist/SHA256SUMS.txt
            dist/file-evidence.txt
            dist/build-evidence-macos-arm64.txt
            dist/runner-evidence-macos-arm64.txt
            dist/print-target.txt
            dist/preexisting-apps.txt
            dist/macos-install-validation.log
            dist/macos-checksum-validation.txt
            dist/installer-exit-code.txt
            dist/cc-switch-validation.txt
            dist/claude-validation.txt
            dist/codex-validation.txt
            dist/final-verification-summary.txt
          if-no-files-found: warn
          retention-days: 14
